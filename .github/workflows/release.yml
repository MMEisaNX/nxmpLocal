name: Build and Release NXMP

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build NXMP with devkitPro Docker
        run: |
          docker run --rm -v "${{ github.workspace }}:/source" -w /source devkitpro/devkita64:latest bash -c '
            set -e
            echo "=== Updating pacman and installing Switch dependencies ==="
            dkp-pacman -Syu --noconfirm
            dkp-pacman -S --noconfirm --needed \
              switch-dev \
              switch-curl \
              switch-libass \
              switch-libvpx \
              switch-glm \
              switch-libpng \
              switch-ntfs-3g \
              switch-libfribidi \
              switch-bzip2 \
              switch-libarchive \
              switch-mbedtls \
              switch-pkg-config \
              switch-harfbuzz \
              switch-libjpeg-turbo \
              switch-dav1d \
              switch-freetype \
              switch-libwebp \
              switch-libssh2 \
              switch-lwext4 \
              unzip \
              zip

            echo "=== Downloading pre-compiled portlibs ==="
            curl -L -o /tmp/portlibs.zip https://github.com/proconsule/nxmp-portlibs/releases/download/v1.0.0/nxmp.nightly.portibs.zip
            unzip -o /tmp/portlibs.zip -d /opt/devkitpro/portlibs/
            rm -f /tmp/portlibs.zip

            echo "=== Building NXMP ==="
            source /opt/devkitpro/switchvars.sh
            make -j$(nproc)
          '

      - name: Package Release
        run: |
          mkdir -p package/switch/nxmp
          cp nxmp.nro package/switch/nxmp/
          if [ -d romfs ]; then cp -r romfs package/switch/nxmp/; fi
          cd package
          zip -r ../nxmp-netflix-local.zip switch/
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nxmp-netflix-build
          path: |
            nxmp.nro
            nxmp-netflix-local.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0-netflix' }}
          name: NXMP Netflix Local Release ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          body: |
            ## NXMP Netflix Local Edition
            
            First release featuring the Netflix-style local video UI for Nintendo Switch!
            
            ### ✨ Features:
            - **Netflix Interface**: Dark aesthetic with red accents, category selector, and hero banner.
            - **Local SD Video Library**: Dedicated solely to local videos on Nintendo Switch SD card.
            - **Dynamic Categories**: Automatically treats each subfolder as a category (e.g. Movies, Anime, Lectures).
            - **Poster & Artwork**: Displays movie posters from folder images (`poster.jpg`, `cover.jpg`) or `<video_name>.jpg`.
            - **Folder Selector**: Choose and change library root directory anytime with `(Y)`.
            
            ### 🎮 Controls:
            - **(A)** Play video
            - **(B)** Back / Stop video
            - **(L / R)** Switch categories
            - **(Y)** Change SD Library Folder
            - **(X)** Settings
            
            ### 📦 Installation:
            1. Download `nxmp-netflix-local.zip` below and extract it to the root of your SD card (or place `nxmp.nro` inside `/switch/nxmp/`).
            2. Launch via the Homebrew Menu on your Switch (holding R while launching a game for Full Memory/Title Override mode is recommended).
          files: |
            nxmp.nro
            nxmp-netflix-local.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
